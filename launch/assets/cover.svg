    <path d="M-91-51c49-12 57 7 92 10 49 4 52-20 93-9M-103 12c37-15 74 8 113 2 35-6 58-17 86-9M-84 63c41-7 72 2 113 1" fill="none" stroke="#98d8e7" stroke-opacity=".18" stroke-width="9" stroke-linecap="round"/>
    <circle r="105" fill="none" stroke="#b8ecff" stroke-opacity=".62" stroke-width="1.5"/>
  </g>
  <ellipse cx="440" cy="224" rx="173" ry="81" transform="rotate(-27 440 224)" fill="none" stroke="#93dff5" stroke-opacity=".22" stroke-width="14" filter="url(#halo)"/>
  <ellipse cx="440" cy="224" rx="173" ry="81" transform="rotate(-27 440 224)" fill="none" stroke="#93dff5" stroke-opacity=".8" stroke-width="2"/>
  <g fill="#cff5ff">
    <circle cx="305" cy="297" r="4"/>
    <circle cx="339" cy="151" r="3"/>
    <circle cx="388" cy="117" r="3"/>
    <circle cx="447" cy="107" r="3"/>
    <circle cx="514" cy="116" r="3"/>
    <circle cx="571" cy="156" r="3"/>
    <circle cx="605" cy="217" r="3"/>
    <circle cx="598" cy="276" r="3"/>
    <circle cx="551" cy="331" r="3"/>
