<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 500" role="img" aria-labelledby="title desc">
  <title id="title">Astronaut Academy cover</title>
  <desc id="desc">Original abstract orbital map with nine course markers and GatsbyZero wordmark.</desc>
  <defs>
    <linearGradient id="space" x2="1" y2="1">
      <stop stop-color="#081828"/>
      <stop offset=".55" stop-color="#050d1a"/>
      <stop offset="1" stop-color="#02060e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#277aa3" stop-opacity=".32"/>
      <stop offset="1" stop-color="#277aa3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x2=".9" y2="1">
      <stop stop-color="#58b8d7"/>
      <stop offset=".38" stop-color="#16466b"/>
      <stop offset="1" stop-color="#07172b"/>
    </linearGradient>
    <filter id="halo"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <rect width="630" height="500" fill="url(#space)"/>
  <circle cx="453" cy="246" r="263" fill="url(#glow)"/>
  <g fill="none" stroke="#8ac7e4" stroke-opacity=".11" stroke-width="1">
